[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-churn-mlops"
version = "1.0.0"
description = "Explainable customer churn ML lifecycle with Airflow, Docker and a batch prediction API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.8.0",
  "catboost==1.2.8", "matplotlib==3.10.8",
  "fastapi==0.121.3", "uvicorn==0.38.0"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.5", "build==1.3.0"]

[project.scripts]
churn-pipeline = "telecom_churn.pipeline:main"
churn-demo = "telecom_churn.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]
